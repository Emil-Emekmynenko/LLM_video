[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-dataset-factory"
version = "0.1.0"
description = "Prepare, validate, package, and deliver video assets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=46,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.12,<1",
  "redis>=6,<8",
  "rq>=2,<3",
  "scenedetect>=0.7,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
asr = [
  "faster-whisper>=1.2,<2",
]
delivery-s3 = [
  "boto3>=1.42,<2",
]
delivery-gcs = [
  "google-cloud-storage>=3.8,<4",
]
delivery = [
  "boto3>=1.42,<2",
  "google-cloud-storage>=3.8,<4",
]
dev = [
  "httpx2>=2,<3",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
media_factory = ["ui/*", "schemas/**/*.json"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["media_factory"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "google.cloud.*"]
ignore_missing_imports = true
