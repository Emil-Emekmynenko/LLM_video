services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: media_factory
      POSTGRES_USER: media_factory
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media_factory -d media_factory"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

  api:
    build: .
    environment:
      MEDIA_FACTORY_ENV: development
      MEDIA_FACTORY_DATABASE_URL: postgresql+psycopg://media_factory:local-development-only@postgres:5432/media_factory
      MEDIA_FACTORY_UPLOAD_DIR: /data/uploads
      MEDIA_FACTORY_FFPROBE_BIN: ffprobe
      MEDIA_FACTORY_FFMPEG_BIN: ffmpeg
      MEDIA_FACTORY_AUTO_CREATE_SCHEMA: "false"
      MEDIA_FACTORY_REDIS_URL: redis://redis:6379/0
      MEDIA_FACTORY_QUEUE_NAME: media-tasks
      MEDIA_FACTORY_VLM_PROVIDER: ${MEDIA_FACTORY_VLM_PROVIDER:-fake}
      MEDIA_FACTORY_ALLOW_FAKE_VLM: ${MEDIA_FACTORY_ALLOW_FAKE_VLM:-true}
      MEDIA_FACTORY_QWEN_BASE_URL: ${MEDIA_FACTORY_QWEN_BASE_URL:-http://host.docker.internal:8001/v1}
      MEDIA_FACTORY_QWEN_API_KEY: ${MEDIA_FACTORY_QWEN_API_KEY:-EMPTY}
      MEDIA_FACTORY_QWEN_MODEL: ${MEDIA_FACTORY_QWEN_MODEL:-Qwen/Qwen3-VL-8B-Instruct}
      MEDIA_FACTORY_QWEN_MODEL_REVISION: ${MEDIA_FACTORY_QWEN_MODEL_REVISION:-e0a319f4d147b3916275a053b0583ca82f351e90}
      MEDIA_FACTORY_QWEN_TIMEOUT_SECONDS: ${MEDIA_FACTORY_QWEN_TIMEOUT_SECONDS:-600}
      MEDIA_FACTORY_QWEN_MAX_RETRIES: ${MEDIA_FACTORY_QWEN_MAX_RETRIES:-2}
      MEDIA_FACTORY_QWEN_TEMPERATURE: ${MEDIA_FACTORY_QWEN_TEMPERATURE:-0.1}
      MEDIA_FACTORY_QWEN_MAX_TOKENS: ${MEDIA_FACTORY_QWEN_MAX_TOKENS:-2048}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media-data:/data

  worker:
    build: .
    command: ["python", "-m", "media_factory.workers.main"]
    environment:
      MEDIA_FACTORY_ENV: development
      MEDIA_FACTORY_DATABASE_URL: postgresql+psycopg://media_factory:local-development-only@postgres:5432/media_factory
      MEDIA_FACTORY_UPLOAD_DIR: /data/uploads
      MEDIA_FACTORY_FFPROBE_BIN: ffprobe
      MEDIA_FACTORY_FFMPEG_BIN: ffmpeg
      MEDIA_FACTORY_AUTO_CREATE_SCHEMA: "false"
      MEDIA_FACTORY_REDIS_URL: redis://redis:6379/0
      MEDIA_FACTORY_QUEUE_NAME: media-tasks
      MEDIA_FACTORY_VLM_PROVIDER: ${MEDIA_FACTORY_VLM_PROVIDER:-fake}
      MEDIA_FACTORY_ALLOW_FAKE_VLM: ${MEDIA_FACTORY_ALLOW_FAKE_VLM:-true}
      MEDIA_FACTORY_QWEN_BASE_URL: ${MEDIA_FACTORY_QWEN_BASE_URL:-http://host.docker.internal:8001/v1}
      MEDIA_FACTORY_QWEN_API_KEY: ${MEDIA_FACTORY_QWEN_API_KEY:-EMPTY}
      MEDIA_FACTORY_QWEN_MODEL: ${MEDIA_FACTORY_QWEN_MODEL:-Qwen/Qwen3-VL-8B-Instruct}
      MEDIA_FACTORY_QWEN_MODEL_REVISION: ${MEDIA_FACTORY_QWEN_MODEL_REVISION:-e0a319f4d147b3916275a053b0583ca82f351e90}
      MEDIA_FACTORY_QWEN_TIMEOUT_SECONDS: ${MEDIA_FACTORY_QWEN_TIMEOUT_SECONDS:-600}
      MEDIA_FACTORY_QWEN_MAX_RETRIES: ${MEDIA_FACTORY_QWEN_MAX_RETRIES:-2}
      MEDIA_FACTORY_QWEN_TEMPERATURE: ${MEDIA_FACTORY_QWEN_TEMPERATURE:-0.1}
      MEDIA_FACTORY_QWEN_MAX_TOKENS: ${MEDIA_FACTORY_QWEN_MAX_TOKENS:-2048}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media-data:/data

volumes:
  postgres-data:
  redis-data:
  media-data:
